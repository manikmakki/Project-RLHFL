version: '3.8'

services:
  rlhfl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rlhfl
    ports:
      - "8000:8000"
    privileged: true
    volumes:
      - ./volumes/models:/models
      - ./volumes/data:/data
      - ./volumes/config:/config
      - ./volumes/checkpoints:/checkpoints
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist the Intel SYCL/OpenCL JIT cache across container restarts.
      # Without this, every cold start recompiles all bitsandbytes XPU kernels
      # (can take 30-60 s per kernel, potentially triggering the xe hang timeout).
      - ./volumes/sycl_cache:/root/.cache/sycl
      - ./volumes/opencl_cache:/root/.cache/opencl
    # Intel Arc Pro B60 GPU passthrough via DRI devices.
    # The render/video group GIDs are host-specific — find yours with:
    #   getent group render video
    # (109 is a common default for "render" on many distros, but verify;
    # this repo's dev host uses 991/44, which won't necessarily match yours.)
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - 109 # render group (owns /dev/dri/renderD* — compute access) — VERIFY
      - 44  # video group (owns /dev/dri/card* — required by Level Zero for device init) — VERIFY
    # Level Zero's DRM initialization on kernel 7.0 / Xe2 requires capabilities and
    # syscalls that Docker drops by default.  SYS_ADMIN is needed for some DRM memory
    # management ioctls; seccomp=unconfined unblocks any perf/io_uring paths the
    # 26.05 GPU backend exercises during zeInit.
    cap_add:
      - SYS_ADMIN
      - PERFMON
    security_opt:
      - seccomp:unconfined
    environment:
      - CONFIG_PATH=/config/system_config.yaml
      - DATA_PATH=/data
      - CHECKPOINTS_PATH=/checkpoints
      # oneDNN (used for BF16 CPU ops) has its own thread pool separate from torch.set_num_threads().
      # These must match training.cpu_threads in system_config.yaml.
      - OMP_NUM_THREADS=32
      - MKL_NUM_THREADS=32
      - OPENBLAS_NUM_THREADS=32
      # Persist the SYCL JIT cache so the kernel compilation cost is paid once.
      - SYCL_CACHE_PERSISTENT=1
      - SYCL_CACHE_DIR=/root/.cache/sycl
      # Use Level Zero immediate command lists — submits GPU work directly to
      # hardware without going through the GuC scheduler queue that carries the
      # 20-second hang-detection timeout.  Required for long SYCL JIT
      # compilations and large model dispatches on xe / Battlemage.
      - UR_L0_USE_IMMEDIATE_COMMANDLISTS=1
      - SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1
      # Intel NEO (compute runtime) watchdog — overrides the driver-side timeout.
      # Set to 10 minutes to cover SYCL JIT + 13 GiB model dispatch.
      - NEO_CSR_TIMEOUT_SECONDS=600
      # ZE_AFFINITY_MASK with value "0" is interpreted as a bitmask (0 = no devices)
      # in some Level Zero versions, hiding the GPU entirely.  Omitting it exposes
      # all devices; since there is only one GPU this is equivalent to "index 0".
      # - ZE_AFFINITY_MASK=0
      # aten::_grouped_mm (MoE batched expert matmul) is not yet in torch-xpu-ops.
      # This flag silently falls those ops back to CPU; everything else stays on XPU.
      - PYTORCH_ENABLE_XPU_FALLBACK=1
      # Emit a C-level stack trace on SIGSEGV/SIGABRT so hard crashes are visible
      # in docker compose logs. Remove once GPU + CPU crashes are resolved.
      # - PYTHONFAULTHANDLER=1
      # Show PyTorch C++ call stack on exceptions (complements PYTHONFAULTHANDLER
      # which only fires on signals, not C++ exceptions).
      - TORCH_SHOW_CPP_BACKTRACE=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - llm-network

  llama-server:
    # Build your own local image from llama.cpp's Intel/SYCL Dockerfile and
    # tag it to match (or substitute a published image for your hardware).
    image: local/llama.cpp:server-intel
    container_name: llama-server
    # Whole-directory passthrough, same pattern as rlhfl above — more portable
    # than pinning specific renderD*/card* node numbers, which vary by host
    # and by how many GPUs/drivers are present.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - 109 # render group (owns /dev/dri/renderD* — compute access) — VERIFY
      - 44  # video group (owns /dev/dri/card* — required by Level Zero for device init) — VERIFY
    # Same Level Zero zeInit requirements as rlhfl on this kernel 7.0 / Xe2 host —
    # see rlhfl's cap_add/security_opt comment above.
    cap_add:
      - SYS_ADMIN
      - PERFMON
    security_opt:
      - seccomp:unconfined
    volumes:
      # ${HOME} expands via docker compose's shell-style interpolation.
      # Adjust if your Hugging Face cache lives somewhere non-default
      # (e.g. HF_HOME was overridden).
      - ${HOME}/.cache/huggingface/hub/:/models
      # Same absolute path as rlhfl's mount below. llama.cpp has no
      # hot-reload for LoRA content — --lora is pinned to a stable symlink
      # (current_adapter_path in system_config.yaml) that llama_cpp_deployer.py
      # atomically repoints at the latest checkpoint's GGUF, then restarts
      # this container so it re-reads the (now repointed) file at startup.
      - ./volumes/checkpoints:/checkpoints
    # The snapshot hash in the HF Hub cache layout (models--<org>--<repo>/
    # snapshots/<commit-hash>/...) is unique per download — find yours with:
    #   ls "$HOME/.cache/huggingface/hub/models--unsloth--gemma-4-26B-A4B-it-GGUF/snapshots/"
    environment:
      # Same Level Zero/SYCL tuning as the source-built systemd service
      # (see ~/llama-server-config.env) — without these the container falls
      # back to default device enumeration and allocation limits.
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      - ZES_ENABLE_SYSMAN=1
      - UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS=1
      - GGML_SYCL_ENABLE_FLASH_ATTN=1
    command: >
      -m /models/models--unsloth--gemma-4-26B-A4B-it-GGUF/snapshots/<YOUR_SNAPSHOT_HASH>/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
      --mmproj /models/models--unsloth--gemma-4-26B-A4B-it-GGUF/snapshots/<YOUR_SNAPSHOT_HASH>/mmproj-BF16.gguf
      --reasoning-budget 1024
      --port 8080
      --host 0.0.0.0
      --n-gpu-layers 999
      --flash-attn on
      --lora /checkpoints/current_adapter.gguf
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge
