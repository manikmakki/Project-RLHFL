version: '3.8'

services:
  rlhfl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rlhfl
    ports:
      - "8000:8000"
    volumes:
      - ./volumes/models:/models
      - ./volumes/data:/data
      - ./volumes/config:/config
      - ./volumes/checkpoints:/checkpoints
      - /var/run/docker.sock:/var/run/docker.sock
    # Intel Arc Pro B60 GPU passthrough via DRI devices.
    # The render group (typically GID 109) owns /dev/dri/renderD* —
    # add_group ensures the container process can open those nodes.
    devices:
      - /dev/dri:/dev/dri
    environment:
      - CONFIG_PATH=/config/system_config.yaml
      - DATA_PATH=/data
      - CHECKPOINTS_PATH=/checkpoints
      # oneDNN (used for BF16 CPU ops) has its own thread pool separate from torch.set_num_threads().
      # These must match training.cpu_threads in system_config.yaml.
      - OMP_NUM_THREADS=32
      - MKL_NUM_THREADS=32
      - OPENBLAS_NUM_THREADS=32
      # Persist the SYCL JIT cache so the kernel compilation cost is paid once.
      - SYCL_CACHE_PERSISTENT=1
      # Tell Level Zero to use the first GPU (index 0); adjust if multi-GPU.
      - ZE_AFFINITY_MASK=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge
